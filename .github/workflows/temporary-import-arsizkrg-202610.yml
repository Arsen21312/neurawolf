name: Import nine arsizkrg October memes
on:
  push:
    paths:
      - .github/workflows/temporary-import-arsizkrg-202610.yml
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original approved PNG images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          files = [
    ("01_mozhno_ya_otvechu_zavtra.png", "https://at.adobe.com/G4McO2Lunk6q7fpZ"),
    ("02_ne_vyvozhu.png", "https://at.adobe.com/TqJu5hLX8PslUFSw"),
    ("03_sobirayus_s_myslyami.png", "https://at.adobe.com/cvNWsUW5gWG8B03M"),
    ("04_ustal_nichego_ne_sdelal.png", "https://at.adobe.com/IjAcqxVBRUQ4C6jg"),
    ("05_prosto_polezhu.png", "https://at.adobe.com/JLjIfwlYeIWTapOg"),
    ("06_moralno_offline.png", "https://at.adobe.com/Y25zdT4rK0uJ0gwF"),
    ("07_ne_ignor.png", "https://at.adobe.com/dfaXImE4ZPgjP8IU"),
    ("08_na_pauze.png", "https://at.adobe.com/DnSQbMLZNsxLGhgZ"),
    ("09_stanu_chelovekom.png", "https://at.adobe.com/auJWOAvyfiE2VCvA"),
          ]
          folder = Path("media/arsizkrg/2026-10/series_everyday_202610")
          folder.mkdir(parents=True,exist_ok=True)
          for name, url in files:
              req = Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "image/png,application/octet-stream,*/*"})
              with urlopen(req, timeout=90) as resp:
                  data=resp.read()
              if not data.startswith(b"\x89PNG\r\n\x1a\n") or len(data)<10000:
                  raise ValueError(f"Download is not a PNG: {name}, bytes={len(data)}")
              (folder/name).write_bytes(data)
              print("OK", name, len(data))
          PY
      - name: Commit original memes to raw-addressable folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/arsizkrg/2026-10/series_everyday_202610/
          git commit -m "Import nine approved Arsentiy reaction memes"
          git push
