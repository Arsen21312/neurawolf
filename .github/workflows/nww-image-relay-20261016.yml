name: NWW image relay Oct 16
on:
  push:
    paths:
      - '.github/workflows/nww-image-relay-20261016.yml'
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full resolution PNG media
        run: |
          set -euo pipefail
          mkdir -p media/nww/2026-10
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/T9yFi1HXivh0Pk9P' -o 'media/nww/2026-10/nww_01_ponedelnik.png'
          test "$(head -c 8 'media/nww/2026-10/nww_01_ponedelnik.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/xTW6QdO5ukdvotP3' -o 'media/nww/2026-10/nww_02_ii.png'
          test "$(head -c 8 'media/nww/2026-10/nww_02_ii.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/3GmvD1izoAELvT7Q' -o 'media/nww/2026-10/nww_03_osen.png'
          test "$(head -c 8 'media/nww/2026-10/nww_03_osen.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/xHwaWieE26m8OoPt' -o 'media/nww/2026-10/nww_04_ghosting.png'
          test "$(head -c 8 'media/nww/2026-10/nww_04_ghosting.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/6x3O9BvNRm78gF57' -o 'media/nww/2026-10/nww_05_halloween.png'
          test "$(head -c 8 'media/nww/2026-10/nww_05_halloween.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/yVoidRJMASMELNxi' -o 'media/nww/2026-10/nww_06_zarplata.png'
          test "$(head -c 8 'media/nww/2026-10/nww_06_zarplata.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/MQQ5LU9dtDx9IQBR' -o 'media/nww/2026-10/nww_07_brat.png'
          test "$(head -c 8 'media/nww/2026-10/nww_07_brat.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/CpDSYSOyqBafCxLI' -o 'media/nww/2026-10/nww_08_marketplace.png'
          test "$(head -c 8 'media/nww/2026-10/nww_08_marketplace.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/2vJoSq63fx8aWjda' -o 'media/nww/2026-10/nww_09_icq.png'
          test "$(head -c 8 'media/nww/2026-10/nww_09_icq.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/N51svU2RxEwvW0W1' -o 'media/nww/2026-10/nww_10_holodilnik.png'
          test "$(head -c 8 'media/nww/2026-10/nww_10_holodilnik.png' | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a'
      - name: Commit source images
        run: |
          git config user.name "NWW Media Relay"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media/nww/2026-10/nww_*.png
          git diff --staged --quiet || (git commit -m "stage nww ten original memes for Zernio" && git push)
